# Mosquitto MQTT Broker — Development Config

# Default MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (for browser-based MQTT tools)
listener 9001
protocol websockets

# Allow anonymous connections (dev only — add auth for production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection and message limits
max_queued_messages 1000
max_inflight_messages 20
message_size_limit 65536

# Logging (reduced verbosity for dev)
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
