# Mosquitto MQTT Broker — Development Config

# Default MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (for browser-based MQTT tools)
listener 9001
protocol websockets

# Allow anonymous connections (dev only — add auth for production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
